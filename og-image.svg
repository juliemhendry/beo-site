<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5F3"/>
      <stop offset="100%" style="stop-color:#E8E8E6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative leaf pattern (subtle) -->
  <g opacity="0.08" fill="#3D6B4A">
    <circle cx="100" cy="100" r="80"/>
    <circle cx="1100" cy="530" r="100"/>
    <circle cx="1050" cy="80" r="40"/>
  </g>

  <!-- Logo -->
  <text x="100" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="72" font-weight="600" fill="#3D6B4A">beó</text>

  <!-- Main headline -->
  <text x="100" y="300" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="56" font-weight="500" fill="#1A1A1A">Your phone doesn't have to</text>
  <text x="100" y="370" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="56" font-weight="600" fill="#3D6B4A">control you</text>

  <!-- Subtext -->
  <text x="100" y="460" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" fill="#7A7A7A">Evidence-based research on what actually works</text>
  <text x="100" y="500" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" fill="#7A7A7A">to reduce problematic technology use.</text>

  <!-- CTA -->
  <rect x="100" y="540" width="280" height="50" rx="25" fill="#3D6B4A"/>
  <text x="155" y="573" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="600" fill="white">Join our research</text>

  <!-- URL -->
  <text x="1100" y="590" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="500" fill="#3D6B4A" text-anchor="end">beo.llc</text>
</svg>