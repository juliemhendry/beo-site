<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're in - beò</title>
    <style>
        :root { --primary: #3D6B4A; --background: #F5F5F3; --text-dark: #1A1A1A; --text: #4A4A4A; --text-muted: #9A9A9A; --white: #FFFFFF; --border: #E0E0E0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--background); color: var(--text); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 600px; margin: 0 auto; padding: 0 24px; }
        header { padding: 24px 0; background: var(--white); border-bottom: 1px solid var(--border); }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 28px; font-weight: 600; text-decoration: none; color: var(--primary); }
        nav { display: flex; gap: 24px; align-items: center; }
        nav a { color: var(--text); text-decoration: none; font-size: 15px; font-weight: 500; transition: color 0.2s; }
        nav a:hover { color: var(--primary); }
        nav .icon-link { display: inline-flex; align-items: center; padding: 4px; }
        nav .icon-link svg { display: block; }
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 80px 24px; }
        .thanks-content { text-align: center; max-width: 500px; }
        .checkmark { font-size: 64px; margin-bottom: 24px; }
        h1 { font-size: 36px; font-weight: 600; color: var(--text-dark); margin-bottom: 16px; }
        p { font-size: 18px; color: var(--text); margin-bottom: 24px; line-height: 1.7; }
        .next-steps { background: var(--white); padding: 24px; border-radius: 12px; text-align: left; margin: 32px 0; }
        .next-steps h2 { font-size: 16px; font-weight: 600; color: var(--primary); margin-bottom: 12px; }
        .next-steps p { font-size: 15px; margin-bottom: 0; }
        .links { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 32px; }
        .links a { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 15px; }
        .links a:hover { text-decoration: underline; }
        footer { padding: 32px 0; text-align: center; }
        footer p { font-size: 13px; color: var(--text-muted); }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">beò</a>
                <nav>
                    <a href="blog.html">lab notes</a>
                    <a href="team.html">about</a>
                    <a href="resources.html">resources</a>
                    <a href="mailto:info@beo.llc" title="Contact us" class="icon-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg></a>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <div class="thanks-content">
            <div class="checkmark">✓</div>
            <h1>You're in</h1>
            <p>We'll email you when the study launches. Nothing else, no spam.</p>
            <div class="next-steps">
                <h2>What happens next</h2>
                <p>iOS users: download link in February 2026.<br>Android users: we'll notify you when we're ready for you.</p>
            </div>
            <div class="links">
                <a href="blog.html">Read our research</a>
                <a href="team.html">Meet the team</a>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 beò LLC</p>
    </footer>
<script src="assets/cookies.js"></script>
</body>
</html>
